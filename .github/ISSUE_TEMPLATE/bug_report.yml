name: 🐛 Bug Report
description: Create a report to help improve APH-Profiler
title: '[BUG] '
labels:
- bug
assignees:
- MPHONlC
body:
- type: textarea
  id: describe
  attributes:
    label: Describe the bug
    description: A clear and concise description of what the bug is.
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    options:
    - PC (NA)
    - PC (EU)
    - PC (PTS)
    - Console (Xbox)
    - Console (PlayStation)
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Version
    placeholder: e.g. 2026.09.29.21.48
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: To Reproduce
    description: Steps to reproduce the behavior.
    placeholder: '1. What you were doing:

      2. Action taken:

      3. Error seen:'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: A clear and concise description of what you expected to happen.
- type: textarea
  id: evidence
  attributes:
    label: Screenshots/Logs/Video/Clip/GIF
    description: If applicable, add screenshots, a short video clip or GIF, or paste the chat logs / error text.
- type: textarea
  id: additional
  attributes:
    label: Additional context
    description: Add any other context about the problem here (other add-ons installed, specific zone, etc.).
