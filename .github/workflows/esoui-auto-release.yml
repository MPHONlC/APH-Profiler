name: ESOUI Auto Release

on:
  repository_dispatch:
    types: [libaph-esoui-auto-release]
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run (tests the ESOUI upload against ESOUI's test endpoint, publishes nothing)"
        type: boolean
        default: true
      upload_esoui:
        description: "Upload to ESOUI"
        type: boolean
        default: false
      force:
        description: "Release even if the ESO API version has not changed since the last release"
        type: boolean
        default: false

env:
  AUTO_RELEASE_ENABLED: 'false'
  AUTO_RELEASE_DRY_RUN: 'true'

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      dry: ${{ steps.decide.outputs.dry }}
      upload: ${{ steps.decide.outputs.upload }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "upload=${{ inputs.upload_esoui }}" >> "$GITHUB_OUTPUT"
          elif [ "$AUTO_RELEASE_ENABLED" == "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "dry=$AUTO_RELEASE_DRY_RUN" >> "$GITHUB_OUTPUT"
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "dry=true" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Auto Release Is Off::AUTO_RELEASE_ENABLED is 'false' at the top of this workflow, so the schedule does nothing."
          fi

  api-check:
    needs: switch
    if: needs.switch.outputs.run == 'true'
    uses: ./.github/workflows/api-version-refresh.yml
    secrets: inherit
    permissions:
      contents: write

  detect:
    needs: [switch, api-check]
    if: needs.switch.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.compare.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" == "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Forced by hand."
            exit 0
          fi
          LAST=$(git tag --list 'Version-*' --sort=-creatordate | head -1)
          if [ -z "$LAST" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No Release Yet::No Version-* tag exists, so there is no earlier API to compare against. Release once by hand first."
            exit 0
          fi
          OLD=$(git show "$LAST:APH-Profiler.addon" | grep '^## APIVersion:' | head -1)
          NEW=$(grep '^## APIVersion:' APH-Profiler.addon | head -1)
          echo "Last release ($LAST): $OLD"
          echo "Now:                  $NEW"
          if [ "$OLD" != "$NEW" ]; then
            MINE="${LAST#Version-}"
            if [ "${{ needs.switch.outputs.dry }}" == "true" ]; then
              WHAT="stamped"
              LIB=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" https://api.github.com/repos/MPHONlC/LibAPH/contents/LibAPH.addon | grep -m1 '^## Version:' | awk '{print $3}')
            else
              WHAT="released"
              LIB=$(git ls-remote --tags https://github.com/MPHONlC/LibAPH.git 'refs/tags/Version-*' | sed -n -E 's|.*refs/tags/Version-([0-9]{4}(\.[0-9]{2}){4})$|\1|p' | sort | tail -1)
            fi
            echo "LibAPH $WHAT: ${LIB:-unknown}. This add-on last released: $MINE"
            if [ -n "$LIB" ] && [[ "$LIB" > "$MINE" ]]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Waiting For LibAPH::The API changed, but LibAPH has not $WHAT a version newer than $MINE yet. LibAPH goes first; this add-on tries again when LibAPH's run finishes, or on its next schedule."
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=API Unchanged::The declared API matches the last release, so nothing to publish."
          fi

  release:
    needs: [switch, detect]
    if: needs.switch.outputs.run == 'true' && needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/esoui-release.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      dry_run: ${{ needs.switch.outputs.dry == 'true' }}
      auto_release: true
      upload_esoui: ${{ needs.switch.outputs.upload == 'true' }}
