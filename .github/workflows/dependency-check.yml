name: Dependency Version Check

on:
  repository_dispatch:
    types: [libaph-api-version-refresh]
  push:
    branches: [main]
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/eso-wait-for-libaph

      - uses: ./.github/actions/git-commit-signing
        with:
          ssh_signing_key: ${{ secrets.SSH_SIGNING_KEY }}

      - uses: ./.github/actions/eso-dependency-check
        with:
          manifest_file: 'APH-Profiler.addon'
          dependency_name: 'LibAPH'
          dependency_manifest_url: 'https://raw.githubusercontent.com/MPHONlC/LibAPH/main/LibAPH.addon'
          dependency_release_repo: 'MPHONlC/LibAPH'
          auto_update: true
          git_name: 'MPHONlC'
          git_email: '207844175+MPHONlC@users.noreply.github.com'
